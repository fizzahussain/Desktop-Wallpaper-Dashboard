name: Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist -- --publish never

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) {
            throw 'No Windows installer was produced in dist/.'
          }
          Write-Host "Built installer: $($installer.FullName)"
          Write-Host "Size: $([math]::Round($installer.Length / 1MB, 2)) MB"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-wallpaper-dashboard-windows
          path: dist/*.exe
          if-no-files-found: error
